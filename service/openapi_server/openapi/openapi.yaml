openapi: 3.0.3
info:
  description: API для отслеживания личных привычек и ежедневного прогресса.
  title: API трекера привычек
  version: 1.0.0
servers:
- url: https://api.example.com/v1
tags:
- description: Управление привычками
  name: Habits
paths:
  /habits:
    get:
      operationId: list_habits
      parameters:
      - description: "Включить архивные привычки, если значение равно true."
        explode: true
        in: query
        name: archived
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listHabits_200_response"
          description: Список привычек
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Токен аутентификации отсутствует или недействителен.
      security:
      - bearerAuth: []
      summary: Получить список привычек текущего пользователя
      tags:
      - Habits
      x-openapi-router-controller: openapi_server.controllers.habits_controller
    post:
      operationId: create_habit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
          description: Привычка создана
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Запрос содержит некорректные данные привычки.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Токен аутентификации отсутствует или недействителен.
      security:
      - bearerAuth: []
      summary: Создать привычку
      tags:
      - Habits
      x-openapi-router-controller: openapi_server.controllers.habits_controller
  /habits/{habitId}:
    delete:
      operationId: delete_habit
      parameters:
      - description: Публичный идентификатор привычки.
        explode: false
        in: path
        name: habitId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Привычка успешно удалена.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Токен аутентификации отсутствует или недействителен.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Привычка не найдена.
      security:
      - bearerAuth: []
      summary: Удалить привычку
      tags:
      - Habits
      x-openapi-router-controller: openapi_server.controllers.habits_controller
    get:
      operationId: get_habit
      parameters:
      - description: Публичный идентификатор привычки.
        explode: false
        in: path
        name: habitId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
          description: Данные привычки
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Токен аутентификации отсутствует или недействителен.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Привычка не существует или не принадлежит текущему пользователю.
      security:
      - bearerAuth: []
      summary: Получить одну привычку
      tags:
      - Habits
      x-openapi-router-controller: openapi_server.controllers.habits_controller
    patch:
      operationId: update_habit
      parameters:
      - description: Публичный идентификатор привычки.
        explode: false
        in: path
        name: habitId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
          description: Привычка обновлена
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Запрос содержит некорректные данные для обновления.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Привычка не найдена.
      security:
      - bearerAuth: []
      summary: Обновить выбранные поля привычки
      tags:
      - Habits
      x-openapi-router-controller: openapi_server.controllers.habits_controller
components:
  schemas:
    HabitCreateRequest:
      additionalProperties: false
      example:
        name: Пить воду
        description: Выпивать восемь стаканов в день.
        frequency: daily
        targetPerWeek: 1
      properties:
        name:
          example: Пить воду
          maxLength: 100
          minLength: 1
          title: name
          type: string
        description:
          example: Выпивать восемь стаканов в день.
          maxLength: 500
          title: description
          type: string
        frequency:
          enum:
          - daily
          - weekly
          title: frequency
          type: string
        targetPerWeek:
          default: 7
          maximum: 7
          minimum: 1
          title: targetPerWeek
          type: integer
      required:
      - frequency
      - name
      title: HabitCreateRequest
      type: object
    HabitUpdateRequest:
      additionalProperties: false
      example:
        name: name
        description: description
        frequency: daily
        targetPerWeek: 1
        archived: true
      minProperties: 1
      properties:
        name:
          maxLength: 100
          minLength: 1
          title: name
          type: string
        description:
          maxLength: 500
          title: description
          type: string
        frequency:
          enum:
          - daily
          - weekly
          title: frequency
          type: string
        targetPerWeek:
          maximum: 7
          minimum: 1
          title: targetPerWeek
          type: integer
        archived:
          title: archived
          type: boolean
      title: HabitUpdateRequest
      type: object
    HabitResponse:
      additionalProperties: false
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: name
        description: description
        frequency: daily
        targetPerWeek: 0
        archived: true
        createdAt: 2000-01-23T04:56:07.000+00:00
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          format: uuid
          readOnly: true
          title: id
          type: string
        name:
          title: name
          type: string
        description:
          title: description
          type: string
        frequency:
          enum:
          - daily
          - weekly
          title: frequency
          type: string
        targetPerWeek:
          title: targetPerWeek
          type: integer
        archived:
          title: archived
          type: boolean
        createdAt:
          format: date-time
          readOnly: true
          title: createdAt
          type: string
        updatedAt:
          format: date-time
          readOnly: true
          title: updatedAt
          type: string
      required:
      - archived
      - createdAt
      - frequency
      - id
      - name
      - targetPerWeek
      - updatedAt
      title: HabitResponse
      type: object
    ErrorResponse:
      additionalProperties: false
      example:
        code: HABIT_NOT_FOUND
        message: Привычка не найдена.
      properties:
        code:
          example: HABIT_NOT_FOUND
          title: code
          type: string
        message:
          example: Привычка не найдена.
          title: message
          type: string
      required:
      - code
      - message
      title: ErrorResponse
      type: object
    listHabits_200_response:
      example:
        items:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          description: description
          frequency: daily
          targetPerWeek: 0
          archived: true
          createdAt: 2000-01-23T04:56:07.000+00:00
          updatedAt: 2000-01-23T04:56:07.000+00:00
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          description: description
          frequency: daily
          targetPerWeek: 0
          archived: true
          createdAt: 2000-01-23T04:56:07.000+00:00
          updatedAt: 2000-01-23T04:56:07.000+00:00
        total: 0
      properties:
        items:
          items:
            $ref: "#/components/schemas/HabitResponse"
          title: items
          type: array
        total:
          format: int32
          minimum: 0
          title: total
          type: integer
      required:
      - items
      - total
      title: listHabits_200_response
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
      x-bearerInfoFunc: openapi_server.controllers.security_controller.info_from_bearerAuth
